[package]
name = "obscura"
version = "1.1.0"
description = "A private reading workspace"
license = "MIT"
authors = ["lapismind"]
edition = "2024"

[lib]
# _lib 后缀避免与 bin 同名冲突（Windows 上的 cargo 问题 #8519）
name = "obscura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
